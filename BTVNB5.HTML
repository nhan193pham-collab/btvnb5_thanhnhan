<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Đăng Ký Ứng Tuyển</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;  }
</head>
<body>
    {
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .form-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 580px;
            padding: 36px 32px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef0f3;
        }

        .form-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .form-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: #718096;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .required {
            color: #e53e3e;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            color: #2d3748;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 110px;
            line-height: 1.5;
        }

        .file-input {
            padding: 8px;
            background-color: #ffffff;
            border: 1px dashed #cbd5e1;
            cursor: pointer;
        }

        .file-input:hover {
            border-color: #3182ce;
        }

        .file-note {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #a0aec0;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2b6cb0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2c5282;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h2>Đăng Ký Ứng Tuyển</h2>
            <p>Vui lòng điền đầy đủ các thông tin bên dưới để ứng tuyển</p>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Họ và tên (Full Name) <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Địa chỉ Email (Email Address) <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Số điện thoại (Phone) <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="0912 345 678" pattern="[0-9]{10,11}" required>
            </div>

            <!-- Cover Letter -->
            <div class="form-group">
                <label for="coverletter">Thư giới thiệu bản thân (Cover Letter)</label>
                <textarea id="coverletter" name="coverletter" class="form-control" rows="4" placeholder="Tóm tắt lý do bạn phù hợp với vị trí này..."></textarea>
            </div>

            <!-- Upload Resume/CV -->
            <div class="form-group">
                <label for="resume">Tải lên CV/Resume (Upload Resume/CV) <span class="required">*</span></label>
                <input type="file" id="resume" name="resume" class="form-control file-input" accept=".pdf,.doc,.docx" required>
                <span class="file-note">Định dạng hỗ trợ: .pdf, .doc, .docx</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Nộp hồ sơ ứng tuyển</button>
        </form>
    </div>
</body>
</html>
